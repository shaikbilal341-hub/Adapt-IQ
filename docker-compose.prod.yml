version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: adaptiq_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-adaptiq_research}
    expose:
      - "5432"
    volumes:
      - adaptiq_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - adaptiq_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adaptiq_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-adaptiq_research}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - adaptiq_internal

volumes:
  adaptiq_pgdata_prod:

networks:
  adaptiq_internal:
    driver: bridge
