version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: adaptiq_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-adaptiq_research}
    ports:
      - "5432:5432"
    volumes:
      - adaptiq_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adaptiq_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-adaptiq_research}?schema=public
      JWT_SECRET: ${JWT_SECRET:-adapt-iq-secure-research-secret-key-prod}
    ports:
      - "4000:4000"

volumes:
  adaptiq_pgdata_prod:
